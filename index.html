<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Departamento de Innovación Educativa</title>

    <!-- Metaetiquetas de Seguridad y Control de Caché Estricto -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- PWA Configuración -->
    <meta name="theme-color" content="#032A60">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Hoja de Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Banner Superior -->
    <header>
        <!-- Forzamos la ruta estricta ./ para evitar errores en GitHub Pages -->
        <img src="./DIE.PNG" alt="Departamento de Innovación Educativa" style="width: 100%; height: auto; min-height: 60px; max-height: 120px; object-fit: cover; object-position: center; display: block;">
    </header>

    <main>
        <!-- Cuadrícula de Accesos Principales (Sin imágenes, debajo del banner) -->
        <nav class="button-grid">
            <a href="modelo.html" class="app-btn btn-azul">
                Modelo CONSTRUYE
            </a>

            <a href="blog.html" class="app-btn btn-verde">
                Blog Comunitario
            </a>

            <a href="revista.html" class="app-btn btn-amarillo">
                Revista Digital<br><small>(Próximamente)</small>
            </a>

            <a href="kiosko.html" class="app-btn btn-magenta">
                Kiosko de Proyectos
            </a>

            <a href="capacitacion.html" class="app-btn btn-azul">
                Capacitación
            </a>

            <a href="juventudtv.html" class="app-btn btn-verde">
                Juventud TV
            </a>

            <a href="convocatorias.html" class="app-btn btn-magenta">
                Convocatorias
            </a>
        </nav>

        <!-- Banner de Frases (Mínimo 10 frases, cambia cada minuto) -->
        <section class="banner-container">
            <p id="banner-frase-texto" class="frase-banner" style="transition: opacity 0.5s ease;">
                "Construirse a uno mismo es construir el mundo."
            </p>
            <p id="banner-frase-autor" class="autor-banner" style="transition: opacity 0.5s ease;">
                Modelo Construye
            </p>
        </section>

        <!-- Banner de Noticias Rotativas -->
        <section class="news-banner">
            <img id="banner-noticias-img" src="./assets/banners/1.png" alt="Noticias de Innovación">
        </section>

        <!-- Enlace Transversal Gemelo -->
        <a href="https://mago-del-caos.github.io/Agenda/novedades.html" class="ag-lucem-link">
            <span>Ingresar a Ag Lucem</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
    </main>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
